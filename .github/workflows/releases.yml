---
name: Release

# Do this on every tagged commit. It can also be run manually (e.g. on a fork)
# to build and test the release tarballs; they are then only available as
# workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C target-cpu=native
  MWA_BEAM_FILE: /mwa_full_embedded_element_pattern.h5

jobs:
  build-linux-release:
    name: Build release for Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          [ -n "$AGENT_TOOLSDIRECTORY" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo docker system prune -af --volumes
          sudo apt-get clean
          df -h
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            tzdata \
            build-essential \
            pkg-config \
            cmake \
            curl \
            git \
            lcov \
            libhdf5-dev \
            libfreetype-dev \
            libexpat1-dev \
            libfontconfig-dev \
            ;
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install cfitsio 3.49
        run: |
          curl "https://ftp.eso.org/pub/dfs/pipelines/libraries/cfitsio/cfitsio-3.49.tar.gz" -o cfitsio.tar.gz
          tar -xf cfitsio.tar.gz
          rm cfitsio.tar.gz
          cd cfitsio-3.49
          # Enabling SSE2/SSSE3 could cause portability problems, but it's unlikely that anyone
          # is using such a CPU...
          # https://stackoverflow.com/questions/52858556/most-recent-processor-without-support-of-ssse3-instructions
          # Disabling curl just means you cannot fits_open() using a URL.
          CFLAGS="-O3" ./configure --prefix=/usr/local --enable-reentrant --enable-sse2 --enable-ssse3 --disable-curl

          if [[ "$OSTYPE" == "linux-gnu"* ]]; then
              make -j
              sudo make install
              sudo ldconfig

          elif [[ "$OSTYPE" == "darwin"* ]]; then
              sudo make shared
              sudo make install
          fi

          cd ..

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.9.1"

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Tar
        run: |
          curl https://raw.githubusercontent.com/HDFGroup/hdf5/develop/COPYING -o COPYING-hdf5
          curl https://raw.githubusercontent.com/liberfa/erfa/master/LICENSE -o LICENSE-erfa
          curl https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/License.txt -o LICENSE-cfitsio
          cp .github/workflows/releases-readme.md README.md

          # Build with our recently-built static cfitsio
          export CFITSIO_STATIC=1
          # Don't build against the host CPU
          [ -f .cargo/config.toml ] && rm .cargo/config.toml
          # Don't make it look like the git tree is dirty because we aren't
          # building against the host CPU
          perl -0777 -pe 's/let dirty = .*\n.*\n.*\n.*/let dirty = "";/' src/cli/mod.rs

          for ARCH in {2,3}; do
            echo "Building x86-64-v${ARCH}"
            export CFLAGS="-march=x86-64-v${ARCH}"
            export CXXFLAGS="-march=x86-64-v${ARCH}"
            export RUSTFLAGS="-C target-cpu=x86-64-v${ARCH}"

            # Use --no-default-features to disable plotting; it's too hard to make this portable.
            cargo build --profile production --locked --no-default-features --features=hdf5-static
            mv target/production/hyperdrive .
            tar -acvf mwa_hyperdrive-$(git describe --tags)-Linux-x86-64-v${ARCH}.tar.gz \
            LICENSE COPYING-hdf5 LICENSE-erfa LICENSE-cfitsio README.md \
            hyperdrive

            cargo build --profile production --locked --no-default-features --features=hdf5-static,cuda
            mv target/production/hyperdrive .
            tar -acvf mwa_hyperdrive-$(git describe --tags)-Linux-x86-64-v${ARCH}-CUDA-double.tar.gz \
            LICENSE COPYING-hdf5 LICENSE-erfa LICENSE-cfitsio LICENSE-NVIDIA README.md \
            hyperdrive

            cargo build --profile production --locked --no-default-features --features=hdf5-static,cuda,gpu-single
            mv target/production/hyperdrive .
            tar -acvf mwa_hyperdrive-$(git describe --tags)-Linux-x86-64-v${ARCH}-CUDA-single.tar.gz \
            LICENSE COPYING-hdf5 LICENSE-erfa LICENSE-cfitsio LICENSE-NVIDIA README.md \
            hyperdrive

            cargo clean
          done

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux.tar.gz
          path: "*.tar.gz"
          if-no-files-found: error

  build-linux-everybeam-release:
    name: Build release for Linux with EveryBeam
    runs-on: ubuntu-24.04
    # Build against an old glibc (2.28), so that the binaries run on most
    # Linux systems (e.g. RHEL/Rocky 8+, Ubuntu 20.04+). This is the same base
    # as the manylinux_2_28 images.
    container: almalinux:8
    defaults:
      run:
        # The container's default is sh.
        shell: bash
    steps:
      # Before checking out, so that the checkout is a git repository (needed
      # for the version string).
      - name: Install dependencies
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools
          # EveryBeam needs C++20, so use a newer GCC than the system's.
          dnf install -y \
            gcc-toolset-13-gcc gcc-toolset-13-gcc-c++ gcc-toolset-13-gcc-gfortran \
            cmake make perl patchelf flex bison curl git tar gzip autoconf automake libtool \
            boost-devel hdf5-devel fftw-devel gsl-devel blas-devel lapack-devel \
            freetype-devel fontconfig-devel expat-devel \
            ;
          echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get casacore measures data
        run: |
          mkdir -p measures
          curl -fL https://www.astron.nl/iers/WSRT_Measures.ztar -o WSRT_Measures.ztar
          tar -xf WSRT_Measures.ztar -C measures
          ls measures

      - name: Build and bundle
        run: |
          # Don't build against the host CPU
          [ -f .cargo/config.toml ] && rm .cargo/config.toml
          perl -0777 -pe 's/let dirty = .*\n.*\n.*\n.*/let dirty = "";/' -i src/cli/mod.rs
          VERSION=$(git describe --tags --always)

          for ARCH in {2,3}; do
            echo "Building x86-64-v${ARCH}"
            export CFLAGS="-march=x86-64-v${ARCH}"
            export CXXFLAGS="-march=x86-64-v${ARCH}"
            export RUSTFLAGS="-C target-cpu=x86-64-v${ARCH}"

            # Shared libraries (e.g. HDF5, whose C++ library EveryBeam needs,
            # and freetype/fontconfig for plotting) come from the system and
            # are bundled by bundle_libs.sh.
            cargo build --profile production --locked \
              --features=plotting,everybeam-vendored,cfitsio-static

            DIR="mwa_hyperdrive-${VERSION}-Linux-x86-64-v${ARCH}-everybeam"
            rm -rf "$DIR"
            .github/workflows/bundle_libs.sh target/production/hyperdrive "$DIR"
            mkdir -p "$DIR/share/casacore"
            cp -r measures "$DIR/share/casacore/data"

            # Licenses. EveryBeam (GPL-3.0) makes this binary a GPL-3.0 work.
            SRC=$(ls -d target/production/build/everybeam-sys-*/out/src | head -1)
            cp LICENSE "$DIR/LICENSE-hyperdrive"
            cp "$SRC/everybeam-0.9.0/LICENSE" "$DIR/LICENSE-EveryBeam"
            cp "$SRC/casacore-3.8.2/COPYING" "$DIR/LICENSE-casacore"
            cp "$SRC/aocommon/LICENSE" "$DIR/LICENSE-aocommon"
            cp .github/workflows/releases-readme-everybeam.md "$DIR/README.md"
            tar -acvf "$DIR.tar.gz" "$DIR"
          done

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-everybeam.tar.gz
          path: "*-everybeam.tar.gz"
          if-no-files-found: error

  test-linux-everybeam-release:
    name: Smoke test the EveryBeam release on an old distro
    runs-on: ubuntu-24.04
    needs: build-linux-everybeam-release
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-everybeam.tar.gz

      - name: Run on Ubuntu 20.04
        run: |
          TARBALL=$(ls *-x86-64-v2-everybeam.tar.gz)
          docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -c "
            set -ex
            # Fonts (but not fontconfig/freetype themselves) are needed to plot.
            apt-get update -qq
            # gdb is only used to get a backtrace if hyperdrive crashes.
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              fontconfig-config fonts-dejavu-core gdb
            tar -xf $TARBALL
            HYP=\$(ls -d *-everybeam)/bin/hyperdrive
            \$HYP --version
            sed 's/        i: /        i: -/' test_files/everybeam/mini_srclist.yaml > neg.yaml
            \$HYP vis-subtract -d test_files/everybeam/mini.ms -s neg.yaml \
              --beam-type everybeam --everybeam-element-model skala40_wave \
              --named-sources zenith_source src_n src_s src_e src_w src_ne -o sim.ms
            CAL_ARGS='di-calibrate -d sim.ms -s test_files/everybeam/mini_srclist.yaml
              --beam-type everybeam --everybeam-element-model skala40_wave
              --beam-ms test_files/everybeam/mini.ms -o sols.fits'
            \$HYP \$CAL_ARGS || {
              gdb -q -batch -ex run -ex 'thread apply all bt 25' --args \$HYP \$CAL_ARGS
              exit 1
            }
            \$HYP solutions-plot sols.fits
            ls sols_amps.png sols_phases.png
          "

  create-github-release:
    name: Create a new release
    runs-on: ubuntu-latest
    needs: [build-linux-release, test-linux-everybeam-release]
    # Only for tags. Releases made on forks are marked as pre-releases.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux.tar.gz

      - name: Download Linux EveryBeam artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-everybeam.tar.gz

      - name: Provide new release asset
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: ${{ github.repository != 'MWATelescope/mwa_hyperdrive' }}
          files: |
            *.tar.gz

  rust_release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Only publish from the main repository, never from forks.
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.repository == 'MWATelescope/mwa_hyperdrive' }}
    needs: [create-github-release]
    environment: CI
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable, minimal toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            tzdata \
            build-essential \
            pkg-config \
            cmake \
            curl \
            git \
            lcov \
            libhdf5-dev \
            libfreetype-dev \
            libexpat1-dev \
            libfontconfig-dev \
            ;
        env:
          DEBIAN_FRONTEND: noninteractive

      # We install cfitsio because when releasing to crates.io, it runs
      # the rust docs generation which fails if our code does any
      # writing. With feature cfitsio-static, it has to build cfitsio which
      # involves writing so have to build without that feature when pushing
      # to crates.io
      - name: Install cfitsio 3.49
        run: |
          curl "https://ftp.eso.org/pub/dfs/pipelines/libraries/cfitsio/cfitsio-3.49.tar.gz" -o cfitsio.tar.gz
          tar -xf cfitsio.tar.gz
          rm cfitsio.tar.gz
          cd cfitsio-3.49
          # Enabling SSE2/SSSE3 could cause portability problems, but it's unlikely that anyone
          # is using such a CPU...
          # https://stackoverflow.com/questions/52858556/most-recent-processor-without-support-of-ssse3-instructions
          # Disabling curl just means you cannot fits_open() using a URL.
          CFLAGS="-O3" ./configure --prefix=/usr/local --enable-reentrant --enable-sse2 --enable-ssse3 --disable-curl

          make -j
          sudo make install
          sudo ldconfig

          cd ..
          rm -rf cfitsio-3.49

      - name: Build on latest stable rust
        run: cargo build --release

      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --no-verify
